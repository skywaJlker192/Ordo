name: Сборка Ordo.exe

on:
  push:
    tags: ["v*"]      # git tag v0.1.0 && git push --tags  -> .exe появится в релизе
  workflow_dispatch:   # или вручную: вкладка Actions -> Run workflow

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pyinstaller pillow
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python packaging/make_icon.py
      - run: pyinstaller --noconfirm --clean packaging/ordo.spec
      - name: Архив
        run: Compress-Archive -Path dist/Ordo -DestinationPath Ordo-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Ordo-windows
          path: Ordo-windows.zip
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ordo-windows.zip
